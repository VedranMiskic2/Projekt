<!DOCTYPE html>
<html>
<head>
    <title>Gradovi koje smo posjetili ❤️</title>
    <meta charset="utf-8" />
    
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

    var bounds = [
    [42.3, 13.4],
    [46.6, 19.5] 
];


    var map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
}).setView([45.1, 15.2], 7);

    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    
    var gradovi = [

        //TIPS: možda promijeniti boju lokacije po gradovima/po najčešćim lokacijama koje smo posjetili.


        //#1.
        {ime: "Donji Adnrijevci", lat: 45.18769, lng: 18.29701, opis:"Kraj križnog puta (09:30 - 18:00), 28km"},
        {ime: "Slavonski Brod", lat: 45.15636, lng: 18.00701, opis:"Početak 20. Nadbiskupijskog križnog puta za mlade (21.3.2026.)"},
        
        //VINKOVCI
        {ime: "Vinkovci", lat: 45.28511, lng: 18.79839, opis:"HNK Vinkovci"},
        {ime: "Vinkovci", lat: 45.28911, lng: 18.80218, opis:"Marabu"},
        {ime: "Vinkovci", lat: 45.28003, lng: 18.79908, opis:"Garfield"},
        {ime: "Vinkovci", lat: 45.28975, lng: 18.80630, opis:"Quattro"},
        {ime: "Vinkovci", lat: 45.28817, lng: 18.80529, opis:"Excellet pub"},
        {ime: "Vinkovci", lat: 45.29072, lng: 18.80499, opis:"Prvi poljubac"},
        {ime: "Vinkovci", lat: 45.28390, lng: 18.79730, opis:"Cibalia - trčanje"},
        {ime: "Vinkovci", lat: 45.30000, lng: 18.80289, opis:"HZ"},
        {ime: "Vinkovci", lat: 45.28982, lng: 18.80540, opis:"kebab.."},
        
        //OSIJEK
        {ime: "Osijek", lat: 45.55506, lng: 18.63708, opis:"CineStar, ne prečesto..."},
        {ime: "Osijek", lat: 45.55851, lng: 18.68600, opis:"SKAC"},
        {ime: "Osijek", lat: 45.56059, lng: 18.63744, opis:"KFC"},
        {ime: "Osijek", lat: 45.56455, lng: 18.63572, opis:"MCDonalds 2"},
        {ime: "Osijek", lat: 45.55051, lng: 18.69304, opis:"McDonalds, nekoliko puta godišnje ❤️"},
        
        //VUKOVAR
        {ime: "Vukovar", lat: 45.35302, lng: 19.00162, opis:"CineStar"}
    ];

    
    gradovi.forEach(function(grad) {
        L.marker([grad.lat, grad.lng])
            .addTo(map)
            .bindPopup("Bili smo u " + grad.ime + " ❤️" + "<br>" + grad.opis);
    });
    
</script>

</body>
</html>
